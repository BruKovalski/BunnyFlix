<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Grêmio - BunnyFlix</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0d1b2a 0%, #1a75ff 50%, #000000 100%);
      background-size: cover;
      color: #ffffff;
    }

    .top-bar {
      position: absolute;
      top: 20px;
      left: 30px;
    }

    .top-bar a {
      color: #ffffff;
      text-decoration: none;
      font-weight: bold;
      font-size: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .login-card {
      background: rgba(0, 0, 0, 0.85);
      padding: 40px 32px;
      border-radius: 12px;
      box-shadow: 0 8px 32px 0 rgba(26, 117, 255, 0.4);
      border: 2px solid #1a75ff;
      width: 100%;
      max-width: 380px;
    }

    .header-gremio {
      text-align: center;
      margin-bottom: 25px;
    }

    .header-gremio i {
      font-size: 42px;
      color: #1a75ff;
      margin-bottom: 10px;
    }

    .header-gremio h2 {
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 22px;
      color: #ffffff;
      border-bottom: 2px solid #1a75ff;
      padding-bottom: 8px;
    }

    .alert {
      padding: 10px 14px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 13px;
      text-align: center;
    }

    .alert-erro {
      background-color: rgba(255, 82, 82, 0.2);
      border: 1px solid #ff5252;
      color: #ff5252;
    }

    .input-group {
      margin-bottom: 20px;
    }

    .input-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      color: #d1d5db;
    }

    .input-group input {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #1a75ff;
      background: #0d1b2a;
      color: #ffffff;
      outline: none;
      transition: all 0.3s ease;
    }

    .input-group input:focus {
      border-color: #ffffff;
      box-shadow: 0 0 10px rgba(26, 117, 255, 0.8);
    }

    .btn-login {
      width: 100%;
      padding: 12px;
      background: #1a75ff;
      border: none;
      border-radius: 6px;
      color: #ffffff;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      text-transform: uppercase;
      transition: background 0.3s ease;
    }

    .btn-login:hover {
      background: #0056b3;
    }

    .dica-credenciais {
      margin-top: 20px;
      text-align: center;
      font-size: 12px;
      color: #aaaaaa;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <a href="/"><i class="fa-solid fa-arrow-left"></i> Voltar ao BunnyFlix</a>
  </div>

  <div class="login-card">
    <div class="header-gremio">
      <i class="fa-solid fa-shield-halved"></i>
      <h2>Grêmio FBPA</h2>
    </div>

    <div th:if="${mensagem}" class="alert alert-erro" th:text="${mensagem}"></div>

    <form th:action="@{/login}" method="POST">
      <div class="input-group">
        <label for="usuario"><i class="fa-solid fa-user"></i> Usuário</label>
        <input type="text" id="usuario" name="usuario" placeholder="Digite seu usuário" required>
      </div>

      <div class="input-group">
        <label for="senha"><i class="fa-solid fa-lock"></i> Senha</label>
        <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>
      </div>

      <button type="submit" class="btn-login">Entrar</button>
    </form>

    <div class="dica-credenciais">
      <p><strong>Usuário de teste:</strong> tricolor</p>
      <p><strong>Senha:</strong> 1903</p>
    </div>
  </div>

</body>
</html>
