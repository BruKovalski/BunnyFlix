spring.application.name=bunnyflix
server.port=8080

# H2 Database Config
spring.datasource.url=jdbc:h2:mem:bunnyflixdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# O console do H2 dá acesso total ao banco (incluindo usuários e logs de acesso).
# Deixe desativado; ative apenas em desenvolvimento local: spring.h2.console.enabled=true
spring.h2.console.enabled=false

# JPA Config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Thymeleaf Config (cache desligado facilita o desenvolvimento; ligue em produção)
spring.thymeleaf.cache=false

# Respostas de erro sem detalhes internos
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false

# Desempenho
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/xml,text/plain
spring.web.resources.cache.cachecontrol.max-age=1h

# Dados da loja exibidos nas páginas Contato e Rodapé. Campos vazios não aparecem no site.
# Preencha somente com informações reais.
loja.nome=BunnyFlix
loja.email=
loja.telefone=
loja.endereco=
loja.horario=
loja.instagram=
