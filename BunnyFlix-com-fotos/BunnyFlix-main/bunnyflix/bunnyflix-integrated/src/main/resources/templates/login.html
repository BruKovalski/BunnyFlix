<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Login – BunnyFlix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/gremio.css}" href="/css/gremio.css">
</head>
<body class="login-page">

  <div class="top-bar">
    <a th:href="@{/}" href="/"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Voltar</a>
  </div>

  <main class="login-card">
    <div class="header-gremio">
      <i class="fa-solid fa-shield-halved" aria-hidden="true"></i>
      <h1> Login </h1>
    </div>

    <div th:if="${mensagem}" class="alert alert-erro" role="alert" th:text="${mensagem}"></div>

    <form th:action="@{/login}" action="/login" method="post">
      <div class="input-group">
        <label for="usuario"><i class="fa-solid fa-user" aria-hidden="true"></i> Usuário</label>
        <input type="text" id="usuario" name="usuario" placeholder="Digite seu usuário"
               autocomplete="username" autocapitalize="none" required>
      </div>

      <div class="input-group">
        <label for="senha"><i class="fa-solid fa-lock" aria-hidden="true"></i> Senha</label>
        <input type="password" id="senha" name="senha" placeholder="Digite sua senha"
               autocomplete="current-password" required>
      </div>

      <button type="submit" class="btn-login">Entrar</button>
    </form>

    <div class="dica-credenciais">
      <p><strong>Usuário de teste:</strong> tricolor</p>
      <p><strong>Senha:</strong> 1903</p>
    </div>
  </main>

</body>
</html>
